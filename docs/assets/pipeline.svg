<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-labelledby="t d">
  <title id="t">Agentic Software Delivery: the pipeline</title>
  <desc id="d">AI agents take each piece of work through six stages (plan, build, test, review, verify, release), several sessions at a time in parallel waves. Audits run on demand and their findings become the next plan. Nothing is pushed or deployed without a human go-ahead. Underneath, automated checks run outside the AI.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97757"/>
    </marker>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#172033"/>
    </linearGradient>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .num { font-size: 13px; fill: #64748b; font-weight: 600; letter-spacing: 1px; }
    .stage { font-size: 22px; fill: #f1f5f9; font-weight: 700; letter-spacing: 0.5px; }
    .desc { font-size: 16px; fill: #cbd5e1; }
    .tag { font-size: 14px; fill: #f0a284; }
    .kicker { font-size: 14px; fill: #94a3b8; font-weight: 600; letter-spacing: 2.2px; }
    .title { font-size: 17px; fill: #f1f5f9; font-weight: 700; }
    .chip { font-size: 15px; fill: #e2e8f0; }
    .small { font-size: 15px; fill: #94a3b8; }
  </style>

  <rect x="0" y="0" width="1200" height="620" rx="18" fill="#0f172a"/>

  <text x="34" y="50" class="sans kicker">PLAN → SHIP · AI AGENTS DO THE WORK · RULES ENFORCED IN CODE</text>

  <!-- Stage cards: x = 34 + i * 192, width 172 -->
  <g class="sans">
    <g transform="translate(34,74)">
      <rect width="172" height="160" rx="12" fill="url(#card)" stroke="#334155"/>
      <text x="16" y="28" class="num">01</text>
      <text x="16" y="58" class="stage">PLAN</text>
      <text x="16" y="88" class="desc">Request or audit</text>
      <text x="16" y="109" class="desc">→ prompt packs</text>
      <text x="16" y="142" class="mono tag">/v-plan</text>
    </g>
    <g transform="translate(226,74)">
      <rect width="172" height="160" rx="12" fill="url(#card)" stroke="#334155"/>
      <text x="16" y="28" class="num">02</text>
      <text x="16" y="58" class="stage">BUILD</text>
      <text x="16" y="88" class="desc">Tests first,</text>
      <text x="16" y="109" class="desc">then the code</text>
      <text x="16" y="142" class="mono tag">/v-tdd</text>
    </g>
    <g transform="translate(418,74)">
      <rect width="172" height="160" rx="12" fill="url(#card)" stroke="#334155"/>
      <text x="16" y="28" class="num">03</text>
      <text x="16" y="58" class="stage">TEST</text>
      <text x="16" y="88" class="desc">Tests, lint, types,</text>
      <text x="16" y="109" class="desc">dependency audits</text>
      <text x="16" y="142" class="mono tag">/v-pre-flight</text>
    </g>
    <g transform="translate(610,74)">
      <rect width="172" height="160" rx="12" fill="url(#card)" stroke="#334155"/>
      <text x="16" y="28" class="num">04</text>
      <text x="16" y="58" class="stage">REVIEW</text>
      <text x="16" y="88" class="desc">Adversarial panel,</text>
      <text x="16" y="109" class="desc">2+ distinct lenses</text>
      <text x="16" y="142" class="mono tag">8 reviewers</text>
    </g>
    <g transform="translate(802,74)">
      <rect width="172" height="160" rx="12" fill="url(#card)" stroke="#334155"/>
      <text x="16" y="28" class="num">05</text>
      <text x="16" y="58" class="stage">VERIFY</text>
      <text x="16" y="88" class="desc">Independent QA,</text>
      <text x="16" y="109" class="desc">convention checks</text>
      <text x="16" y="142" class="mono tag">/v-verify-done</text>
    </g>
    <g transform="translate(994,74)">
      <rect width="172" height="160" rx="12" fill="url(#card)" stroke="#d97757" stroke-width="1.5"/>
      <text x="16" y="28" class="num">06</text>
      <text x="16" y="58" class="stage">RELEASE</text>
      <text x="16" y="88" class="desc">Attest, merge back,</text>
      <text x="16" y="109" class="desc">readiness gate</text>
      <text x="16" y="142" class="mono tag">/v-merge-all</text>
    </g>
  </g>

  <!-- Arrows: between stages, release down to sign-off, audit up into plan -->
  <g stroke="#d97757" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="208" y1="154" x2="222" y2="154"/>
    <line x1="400" y1="154" x2="414" y2="154"/>
    <line x1="592" y1="154" x2="606" y2="154"/>
    <line x1="784" y1="154" x2="798" y2="154"/>
    <line x1="976" y1="154" x2="990" y2="154"/>
    <path d="M1080,236 L1080,264"/>
    <path d="M120,266 L120,238" stroke-dasharray="4 4"/>
  </g>

  <!-- Audit on demand -->
  <g class="sans">
    <rect x="34" y="266" width="364" height="112" rx="12" fill="#111a2e" stroke="#334155" stroke-dasharray="4 4"/>
    <text x="54" y="296" class="title">Audit, on demand</text>
    <text x="54" y="320" class="small">Code and security audits, plus bug hunts.</text>
    <text x="54" y="341" class="small">What they find becomes the next plan.</text>
    <text x="54" y="364" class="mono tag">/v-audit-code · /v-bug-hunt</text>
  </g>

  <!-- Parallel waves -->
  <g class="sans">
    <rect x="418" y="266" width="364" height="112" rx="12" fill="#111a2e" stroke="#334155"/>
    <text x="438" y="296" class="title">Parallel waves</text>
    <text x="438" y="320" class="small">Up to 5 sessions run at once, each</text>
    <text x="438" y="341" class="small">from build to release. A wave is</text>
    <text x="438" y="362" class="small">merged before the next one starts.</text>
  </g>

  <!-- Human sign-off -->
  <g class="sans">
    <rect x="802" y="266" width="364" height="112" rx="12" fill="#1c1917" stroke="#d97757" stroke-width="1.5"/>
    <circle cx="840" cy="320" r="17" fill="none" stroke="#f0a284" stroke-width="2"/>
    <path d="M831,320 l6,6 l12,-13" fill="none" stroke="#f0a284" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="872" y="306" class="title">Human sign-off</text>
    <text x="872" y="330" class="small">Nothing is pushed or deployed</text>
    <text x="872" y="351" class="small">without my go-ahead.</text>
  </g>

  <!-- Enforcement layer -->
  <g class="sans">
    <rect x="34" y="404" width="1132" height="190" rx="14" fill="#0b1222" stroke="#d97757" stroke-dasharray="6 5" stroke-width="1.5"/>
    <text x="56" y="438" class="kicker" fill="#f0a284">ENFORCEMENT LAYER</text>
    <text x="300" y="438" class="small">Checks that run outside the AI, on every command, file edit, hand-off and attempt to finish.</text>
    <g class="chip">
      <rect x="56" y="456" width="262" height="54" rx="9" fill="#16213a" stroke="#334155"/>
      <text x="72" y="489">Stop gate re-checks evidence</text>
      <rect x="332" y="456" width="262" height="54" rx="9" fill="#16213a" stroke="#334155"/>
      <text x="348" y="489">Tamper-evident attestation</text>
      <rect x="608" y="456" width="262" height="54" rx="9" fill="#16213a" stroke="#334155"/>
      <text x="624" y="489">Every review run logged</text>
      <rect x="884" y="456" width="260" height="54" rx="9" fill="#16213a" stroke="#334155"/>
      <text x="900" y="489">Risk tiers from the diff</text>
      <rect x="56" y="522" width="262" height="54" rx="9" fill="#16213a" stroke="#334155"/>
      <text x="72" y="555">Right model for each job</text>
      <rect x="332" y="522" width="262" height="54" rx="9" fill="#16213a" stroke="#334155"/>
      <text x="348" y="555">Destructive-command guards</text>
      <rect x="608" y="522" width="262" height="54" rx="9" fill="#16213a" stroke="#334155"/>
      <text x="624" y="555">Guards re-tested with old bugs</text>
      <rect x="884" y="522" width="260" height="54" rx="9" fill="#16213a" stroke="#334155"/>
      <text x="900" y="555">Every incident → guard + test</text>
    </g>
  </g>
</svg>
